apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: nissastigen
  name: pod-reader
rules:
- apiGroups: [""] # "" indicates the core API group
  resources: ["pods", "pods/log"]
  verbs: ["get", "watch", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: read-pods
  namespace: nissastigen
subjects:
- kind: ServiceAccount
  name: default
  namespace: nissastigen
roleRef:
  kind: Role
  name: pod-reader
  apiGroup: rbac.authorization.k8s.io